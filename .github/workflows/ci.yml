name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # kbb (JVM-free) runs this repository's .cljk tests; `clojure -M:test`
    # found none of them and reported "Ran 0 tests" as success
    # (root ADR-2610100200). A run of zero tests fails here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: kotoba-lang/setup-kbb@a4586e48c72c69229ff1237a1246de63583b607d
      - name: kbb -M:test
        run: |
          set -o pipefail
          kbb -M:test 2>&1 | tee kbb-test.log
          grep -E '^kbb test: [1-9][0-9]* test\(s\), [0-9]+ pass, 0 fail, 0 error' kbb-test.log


  # This repo's own suite passing is not enough: it is a library, and a change
  # can be green here while breaking its consumer. That happened on 2026-07-30
  # in a sibling (kotoba-wasm f4d7afb: green there, compiler conformance
  # 47/52), which is why every kotoba-lang library CI carries this job.
  #
  # artifact is a main dependency of the compiler (kotoba.artifact.core), so the dual-backend conformance run exercises it.
  consumer-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: dep
      - name: Check out the consumer
        run: git clone --depth 1 https://github.com/kotoba-lang/compiler compiler
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: latest
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Compiler dual-backend conformance against this checkout
        working-directory: compiler
        run: |
          clojure -Sdeps "{:aliases {:dep {:override-deps {io.github.kotoba-lang/artifact {:local/root \"../dep\"}}}}}" \
            -M:dep:conformance
